<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="logo-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#logo-drop-shadow)">
    <!-- Outer White Squircle Border -->
    <rect x="32" y="32" width="448" height="448" rx="116" ry="116" fill="#ffffff" />

    <!-- Inner Teal-Green Squircle Area -->
    <rect x="58" y="58" width="396" height="396" rx="90" ry="90" fill="#3e927c" />

    <!-- Stylized Geometric "H" Monogram with seamless border connections -->
    <!-- Left vertical bar: flat top at Y=160, goes down into bottom border -->
    <rect x="160" y="160" width="45" height="300" fill="#ffffff" />

    <!-- Right vertical bar: starts at top border Y=52, flat bottom at Y=352 -->
    <rect x="307" y="52" width="45" height="300" fill="#ffffff" />

    <!-- Center connecting crossbar -->
    <rect x="160" y="234" width="192" height="45" fill="#ffffff" />
  </g>
</svg>
