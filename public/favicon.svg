<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Outer White Rounded Squircle Border spanning edge-to-edge -->
  <rect x="0" y="0" width="512" height="512" rx="128" ry="128" fill="#ffffff" />

  <!-- Inner Teal-Green Squircle Area -->
  <rect x="30" y="30" width="452" height="452" rx="100" ry="100" fill="#3e927c" />

  <!-- Stylized Geometric "H" Monogram scaled to edge -->
  <!-- Left vertical bar: starts at Y=146, seamlessly reaches bottom white border -->
  <rect x="146" y="146" width="52" height="340" fill="#ffffff" />

  <!-- Right vertical bar: seamlessly starts from top white border, reaches Y=366 -->
  <rect x="314" y="24" width="52" height="342" fill="#ffffff" />

  <!-- Center connecting crossbar -->
  <rect x="146" y="230" width="220" height="52" fill="#ffffff" />
</svg>
